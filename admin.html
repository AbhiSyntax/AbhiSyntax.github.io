<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Panel</title>
<style>
*{box-sizing:border-box;font-family:Poppins,Arial,sans-serif}
body{margin:0;background:#111827;color:#fff;padding:20px}
.wrap{max-width:800px;margin:auto}
h1,h2{color:#00eaff}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:none;border-radius:10px;background:#08111f;color:#fff;font-size:15px}
label{font-size:13px;color:#cbd5e1}
button{padding:10px 18px;border:none;border-radius:10px;background:#00eaff;color:#08111f;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
button.red{background:#ef4444;color:#fff}
button.tab.on{box-shadow:0 0 12px #00eaff}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center}
#err{color:#f87171}
</style>
</head>
<body>
<div class="wrap">

<div id="login" hidden>
  <h1>Admin Login</h1>
  <form id="loginForm" class="card">
    <input id="email" type="email" placeholder="Email" required>
    <input id="pass" type="password" placeholder="Password" required>
    <button>Login</button>
    <p id="err"></p>
  </form>
</div>

<div id="panel" hidden>
  <div class="top"><h1>Admin Panel</h1><button id="logout" class="red">Logout</button></div>
  <div>
    <button class="tab" data-tab="projects">Projects</button>
    <button class="tab" data-tab="skills">Skills</button>
    <button class="tab" data-tab="gallery">Gallery</button>
    <button class="tab" data-tab="education">Education</button>
    <button class="tab" data-tab="stats">Stats</button>
    <button class="tab" data-tab="settings">Settings</button>
    <button class="tab" data-tab="messages">Messages</button>
  </div>
  <div id="content"></div>
</div>

</div>
<script type="module" src="admin.js"></script>
</body>
</html>
